name: Scope
options:
  bundleIdPrefix: dev.maastrich.scope
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

packages:
  ScopeKit:
    path: .
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.20.0
  MCP: # the official Swift MCP SDK, used by `scope mcp` only
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    from: 0.9.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # Exact, not `from:`: no Package.resolved is committed for the app, so a range lets CI embed a newer
    # framework than the tools release.yml downloads to sign the update.
    exactVersion: 2.10.0 # binary xcframework (arm64 + x86_64); bump SPARKLE_VERSION in .github/workflows/release.yml too

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  # Named scope-cli, not scope: the app target is `Scope`, and on a case-insensitive filesystem the two
  # would share one `Scope.build` intermediate directory — the second one to build wins and the first
  # fails with "unable to open dependencies file". The binary is still `scope` (PRODUCT_NAME).
  scope-cli:
    type: tool
    platform: macOS
    sources:
      - path: Sources/scope
    dependencies:
      - package: ScopeKit
        product: ScopeControl
      - package: MCP
        product: MCP
    settings:
      base:
        PRODUCT_NAME: scope
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES

  scope-hook:
    type: tool
    platform: macOS
    sources:
      - path: Sources/scope-hook
    dependencies:
      - package: ScopeKit
        product: ScopeAdapters
    settings:
      base:
        PRODUCT_NAME: scope-hook
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES

  Scope:
    type: application
    platform: macOS
    sources:
      - path: App/Scope
        excludes:
          - "*.entitlements"
    dependencies:
      - package: ScopeKit
        product: ScopeCore
      - package: ScopeKit
        product: ScopeGit
      - package: ScopeKit
        product: ScopeDrivers
      - package: ScopeKit
        product: ScopeAdapters
      - package: ScopeKit
        product: ScopeTasks
      - package: ScopeKit
        product: ScopeGraph
      - package: ScopeKit
        product: ScopeControl
      - package: ScopeKit
        product: ScopeAssist
      - package: SwiftTerm
        product: SwiftTerm
      - package: Sparkle # embeds Sparkle.framework (Autoupdate, Updater.app, Installer.xpc, Downloader.xpc)
        product: Sparkle
      - target: scope-hook
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: scope-cli # the CLI; the app can symlink it onto the user's PATH
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: App/Scope/Info.plist
      properties:
        CFBundleDisplayName: $(SCOPE_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)" # -> sparkle:minimumSystemVersion in the appcast
        NSHumanReadableCopyright: "Copyright © 2026 Mathis Pinsault and Scope contributors. MIT License."
        LSApplicationCategoryType: public.app-category.developer-tools
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        # The island under the notch stays still during a Focus (IslandQuiet); asked once, when the island first shows.
        NSFocusStatusUsageDescription: "The island under the notch stays still while a Focus is on."
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.folder]
        # scope://task/new?scope=…&prompt=… (AppModel.open(url:)). A Debug build answers scope-debug:// so a link
        # never lands in whichever copy LaunchServices happens to prefer.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [$(SCOPE_URL_SCHEME)]
        NSServices:
          - NSMenuItem: { default: "Open in $(SCOPE_DISPLAY_NAME)" }
            NSMessage: openInScope
            # The port is the app, not the feature: with one name for both builds the Services menu sent
            # "Open in Scope Debug" to whichever copy registered the port first.
            NSPortName: $(PRODUCT_NAME)
            NSSendFileTypes: [public.folder]
        # --- Sparkle -------------------------------------------------------------------------------
        # Feed = asset of the LATEST non-draft, non-prerelease GitHub release (302 -> per-tag asset URL).
        # Empty in a Debug build, which must never find a feed (see UpdaterController).
        SUFeedURL: $(SCOPE_UPDATE_FEED_URL)
        # Public EdDSA key, output of `generate_keys` (README > Releasing > One-time setup). Must stay a real
        # key: an invalid/empty value makes Sparkle show "Unable to Check For Updates" at every launch
        # (scripts/package.sh refuses it), and a key can never be added later for already-installed copies.
        SUPublicEDKey: Ldp4ftmih/ALIvBpr0GLYUKO9ul5SRqGRW+35cK3Goo=
        # Check without asking the user first (default without this key: ask on second launch).
        SUEnableAutomaticChecks: true
        # Hourly, Sparkle's floor. With about one release a day, the daily check that was here landed a release
        # 12 h late on average, and the owner pressed "Check for Updates…" by hand instead. `UpdaterController`
        # also checks when the app comes to the front or the Mac wakes, at most once every 15 minutes.
        SUScheduledCheckInterval: 3600
        # Download and stage the update in the background, no dialog. Sparkle installs it when Scope quits; until
        # then `UpdaterController` offers "Restart to Update" in a band and in the menu, and never relaunches on its
        # own: a relaunch hangs up every running thread.
        SUAutomaticallyUpdate: true
        # Do NOT set SUEnableInstallerLauncherService / SUEnableDownloaderService: Scope is not sandboxed.
    entitlements:
      path: App/Scope/Scope.entitlements
      properties:
        # Scope is distributed outside the App Store and spawns PTYs and arbitrary binaries, so
        # com.apple.security.app-sandbox is NOT set. Hardened runtime comes from ENABLE_HARDENED_RUNTIME.
        #
        # disable-library-validation is required as long as the DMG is ad-hoc signed. Library validation wants
        # a loaded framework to carry the same Team ID as the process; an ad-hoc signature has none on either
        # side, and dyld does not treat two independent ad-hoc signatures as one signer — so the released app
        # refused to load its own Sparkle.framework and died at launch ("different Team IDs"). A Debug build
        # never showed it: it carries get-task-allow, which relaxes the same check. Drop this once the DMG is
        # signed with a real Developer ID, where the app and the framework share a team.
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.maastrich.scope
        PRODUCT_NAME: Scope
        # Without this, Color.accentColor resolves to the user's System Settings accent and
        # AccentColor.colorset is never read — the app would keep following a graphite or red system
        # accent whatever the catalogue says.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SCOPE_DISPLAY_NAME: Scope
        SCOPE_URL_SCHEME: scope
        SCOPE_UPDATE_FEED_URL: https://github.com/maastrich/scope/releases/latest/download/appcast.xml
        MARKETING_VERSION: "0.0.0"   # dev builds; releases: tag without "v" (scripts/package.sh)
        CURRENT_PROJECT_VERSION: "0" # dev builds; releases: git rev-list --count HEAD (scripts/package.sh)
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # A Debug build is a different app to macOS: its own bundle id (so LaunchServices, notifications and
        # the Services menu never mix it up with the installed copy) and its own name in the Dock and the menu
        # bar. Its data lives in ~/.scope-debug — see AppEnvironment.live().
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.maastrich.scope.debug
          SCOPE_DISPLAY_NAME: Scope Debug
          SCOPE_URL_SCHEME: scope-debug
          # No feed: a Debug build is 0.0.0, so any release would look like an update and overwrite it.
          SCOPE_UPDATE_FEED_URL: ""
          # The bundle on disk is renamed too, not just the display name: Spotlight indexes the file, so two
          # Scope.app would both answer to "Scope" and you could not tell which one you were opening.
          PRODUCT_NAME: Scope Debug

schemes:
  Scope:
    build:
      targets:
        Scope: all
        scope-hook: all
        scope-cli: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: ScopeKit/ScopeKitTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
