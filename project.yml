name: Scope
options:
  bundleIdPrefix: dev.maastrich.scope
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

packages:
  ScopeKit:
    path: .
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.20.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.6 # binary xcframework (arm64 + x86_64); bump SPARKLE_VERSION in .github/workflows/release.yml too

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  scope-hook:
    type: tool
    platform: macOS
    sources:
      - path: Sources/scope-hook
    dependencies:
      - package: ScopeKit
        product: ScopeAdapters
    settings:
      base:
        PRODUCT_NAME: scope-hook
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES

  Scope:
    type: application
    platform: macOS
    sources:
      - path: App/Scope
        excludes:
          - "*.entitlements"
    dependencies:
      - package: ScopeKit
        product: ScopeCore
      - package: ScopeKit
        product: ScopeGit
      - package: ScopeKit
        product: ScopeDrivers
      - package: ScopeKit
        product: ScopeAdapters
      - package: ScopeKit
        product: ScopeTasks
      - package: ScopeKit
        product: ScopeGraph
      - package: SwiftTerm
        product: SwiftTerm
      - package: Sparkle # embeds Sparkle.framework (Autoupdate, Updater.app, Installer.xpc, Downloader.xpc)
        product: Sparkle
      - target: scope-hook
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: App/Scope/Info.plist
      properties:
        CFBundleDisplayName: Scope
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)" # -> sparkle:minimumSystemVersion in the appcast
        NSHumanReadableCopyright: "Copyright © 2026 Mathis Pinsault and Scope contributors. MIT License."
        LSApplicationCategoryType: public.app-category.developer-tools
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.folder]
        NSServices:
          - NSMenuItem: { default: "Open in Scope" }
            NSMessage: openInScope
            NSPortName: Scope
            NSSendFileTypes: [public.folder]
        # --- Sparkle -------------------------------------------------------------------------------
        # Feed = asset of the LATEST non-draft, non-prerelease GitHub release (302 -> per-tag asset URL).
        SUFeedURL: https://github.com/maastrich/scope/releases/latest/download/appcast.xml
        # Public EdDSA key, output of `generate_keys` (README > Releasing > One-time setup). Must stay a real
        # key: an invalid/empty value makes Sparkle show "Unable to Check For Updates" at every launch
        # (scripts/package.sh refuses it), and a key can never be added later for already-installed copies.
        SUPublicEDKey: Ldp4ftmih/ALIvBpr0GLYUKO9ul5SRqGRW+35cK3Goo=
        # Check daily without asking the user first (default without this key: ask on second launch).
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400 # seconds; Sparkle enforces a 3600 minimum
        SUAutomaticallyUpdate: false    # notify, do not install silently
        # Do NOT set SUEnableInstallerLauncherService / SUEnableDownloaderService: Scope is not sandboxed.
    entitlements:
      path: App/Scope/Scope.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.maastrich.scope
        PRODUCT_NAME: Scope
        MARKETING_VERSION: "0.0.0"   # dev builds; releases: tag without "v" (scripts/package.sh)
        CURRENT_PROJECT_VERSION: "0" # dev builds; releases: git rev-list --count HEAD (scripts/package.sh)
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        COMBINE_HIDPI_IMAGES: YES

schemes:
  Scope:
    build:
      targets:
        Scope: all
        scope-hook: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: ScopeKit/ScopeKitTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
