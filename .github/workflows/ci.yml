# Continuous integration: every pull request and every push to main.
#
#   scopekit  swift build + swift test (Swift Testing) of the local SwiftPM package
#   app       xcodegen -> xcodebuild Release build of Scope.app (ad-hoc signed) + app tests when a test target exists
#             pull request: arm64 only, unoptimised; push to main: universal and optimised, as release.yml archives it
#
# Where the time goes, and why each step is shaped the way it is: docs/design/CI_PERFORMANCE.md.
#
# Runner: macos-26 (Apple Silicon, free and unlimited for public repositories).
# Xcode is pinned through DEVELOPER_DIR; bump it here and in release.yml together.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # bash --noprofile --norc -eo pipefail

env:
  # macos-26 ships Xcode 26.0.1 … 26.6 (26.6 = image default, Swift 6.3.3, same build as the maintainer's machine).
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  # Directory that holds ScopeKit's Package.swift ("." = repository root; "ScopeKit" if the package moves).
  PACKAGE_PATH: .

jobs:
  scopekit:
    name: ScopeKit (swift test)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build directory
        uses: actions/cache@v6
        with:
          path: ${{ env.PACKAGE_PATH }}/.build
          key: spm-build-${{ runner.os }}-${{ runner.arch }}-xcode26.6-${{ hashFiles('**/Package.swift', '**/Package.resolved') }}
          restore-keys: |
            spm-build-${{ runner.os }}-${{ runner.arch }}-xcode26.6-

      # One build for the products and the tests: a `swift test` that builds plans the package a second time.
      - name: Build
        run: swift build --package-path "$PACKAGE_PATH" --build-tests

      - name: Test (Swift Testing)
        run: swift test --package-path "$PACKAGE_PATH" --skip-build --parallel

  app:
    name: Scope.app (xcodebuild)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen --version
          # SwiftTerm >= 1.12 ships a Metal shader and Xcode 26 does not bundle the Metal compiler.
          # Idempotent: ~1 s when already installed, ~20 s / 700 MB otherwise.
          xcodebuild -downloadComponent MetalToolchain

      - name: Cache SwiftPM clones (SourcePackages)
        uses: actions/cache@v6
        with:
          path: SourcePackages
          key: spm-xcode-${{ runner.os }}-${{ runner.arch }}-xcode26.6-${{ hashFiles('project.yml', '**/Package.swift', '**/Package.resolved') }}
          restore-keys: |
            spm-xcode-${{ runner.os }}-${{ runner.arch }}-xcode26.6-

      - name: Generate Scope.xcodeproj
        run: xcodegen generate --spec project.yml

      # No separate -resolvePackageDependencies step: the build resolves the graph again whatever ran before it,
      # so resolving first only paid for it twice.
      - name: Build (Release, ad-hoc signed)
        env:
          FAST_BUILD: ${{ github.event_name == 'pull_request' }}
        run: |
          mkdir -p build
          destination='platform=macOS'
          overrides=()
          if [ "$FAST_BUILD" = true ]; then
            # Still the Release configuration -- same compile conditions, bundle id and Info.plist as the
            # shipped app -- minus what makes it slow: the second architecture and the optimiser. The push to
            # main keeps both, so nothing reaches a tag without the build release.yml archives.
            destination='platform=macOS,arch=arm64'
            overrides=(ONLY_ACTIVE_ARCH=YES SWIFT_OPTIMIZATION_LEVEL=-Onone SWIFT_COMPILATION_MODE=incremental ENABLE_DEBUG_DYLIB=NO)
          fi
          xcodebuild build \
            -project Scope.xcodeproj -scheme Scope -configuration Release \
            -destination "$destination" \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            -skipPackagePluginValidation -skipMacroValidation -showBuildTimingSummary \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM= \
            "${overrides[@]}" \
            | tee build/xcodebuild.log | { if command -v xcbeautify >/dev/null; then xcbeautify; else cat; fi; }
          # xcbeautify drops the summary; it is the only per-task timing a run leaves behind.
          sed -n '/^Build Timing Summary/,$p' build/xcodebuild.log

      - name: Verify the built app
        run: |
          app=build/DerivedData/Build/Products/Release/Scope.app
          codesign --verify --deep --strict --verbose=2 "$app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' "$app/Contents/Info.plist"
          if [ ! -x "$app/Contents/Helpers/scope-hook" ]; then
            echo "::warning::scope-hook is not embedded at Contents/Helpers/scope-hook"
          fi
          # Exit 0 = valid key, 2 = key absent (no auto-update possible), 1 = invalid key (Sparkle shows an error alert at launch).
          scripts/sparkle-key-check.sh "$app/Contents/Info.plist" \
            || echo "::warning::SUPublicEDKey is missing or invalid (see README > Releasing > One-time setup). scripts/package.sh refuses to release an invalid key."

      - name: App tests (only when the project has a test target)
        run: |
          # Read project.yml rather than ask `xcodebuild -list`, which resolves the package graph to answer (~25 s).
          if grep -Eq '^[[:space:]]+type:[[:space:]]*bundle\.(unit|ui)-test' project.yml; then
            xcodebuild test \
              -project Scope.xcodeproj -scheme Scope -configuration Debug \
              -destination 'platform=macOS' \
              -derivedDataPath build/DerivedData \
              -clonedSourcePackagesDirPath SourcePackages \
              -skipPackagePluginValidation -skipMacroValidation \
              CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM= \
              | tee build/xcodebuild-test.log | { if command -v xcbeautify >/dev/null; then xcbeautify; else cat; fi; }
          else
            echo "No test bundle in project.yml: skipping xcodebuild test (ScopeKit tests run in the scopekit job)."
          fi

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-logs
          path: build/*.log
          if-no-files-found: ignore
