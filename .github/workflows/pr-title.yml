# Enforce Conventional Commits on pull request titles.
# With "squash merge" + "default commit message: pull request title" enabled in the repository settings,
# the PR title becomes the commit on main that git-cliff turns into CHANGELOG.md entries.
name: PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  lint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout on purpose: pull_request_target runs with a write-capable token on fork PRs.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with [git].commit_parsers in cliff.toml
          types: |
            feat
            fix
            perf
            refactor
            revert
            docs
            test
            build
            ci
            chore
            style
          requireScope: false
          # Lower-case subject, no trailing period.
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: |
            The subject "{subject}" in the PR title "{title}" must start with a lower-case letter and not end with a period.
