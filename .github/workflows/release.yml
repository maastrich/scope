# Tag-driven release.
#
#   scripts/release.sh X.Y.Z   (or a plain `git tag vX.Y.Z && git push origin vX.Y.Z`)
#     └─ release (ubuntu)   version from the tag, notes from CHANGELOG.md (git-cliff fallback), DRAFT GitHub release
#         └─ dmg (macos-26) scripts/package.sh -> Scope-X.Y.Z.dmg  (Developer ID + notarized when the secrets exist,
#                                                                    ad-hoc signed otherwise)
#                           scripts/appcast.sh -> appcast.xml      (only when SPARKLE_PRIVATE_KEY exists)
#                           upload the assets, publish the release, write the job summary
#
# ONE workflow on purpose: a release created with GITHUB_TOKEN never triggers `on: release` workflows.
# Every secret is optional: with none of them the result is an ad-hoc-signed DMG on a published release.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*" # v1.2.3, and v1.2.3-beta.1 (published as a prerelease)
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and (re)publish, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: write # create the release, upload the assets, publish

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false # never kill an upload in flight; a re-run of the same tag queues behind it

defaults:
  run:
    shell: bash # bash --noprofile --norc -eo pipefail

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # Sparkle CLI tools used to sign the update. Keep in sync with the `Sparkle` package version in project.yml.
  SPARKLE_VERSION: "2.9.6"
  SPARKLE_TARBALL_SHA256: "52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192"

jobs:
  release:
    name: Draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      latest: ${{ steps.meta.outputs.latest }}
      notes_source: ${{ steps.notes.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # every tag + full history: "is this the highest version?" and the git-cliff fallback

      - name: Version from the tag
        id: meta
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          version="${TAG#v}"
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          # Highest stable tag decides whether this release becomes "Latest" (= what SUFeedURL resolves to).
          highest="$(git tag --list 'v[0-9]*' | { grep -v -- '-' || true; } | sort -V | tail -n 1)"
          latest=false
          if [ "$prerelease" = false ] && [ "$highest" = "$TAG" ]; then latest=true; fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$TAG version=$version prerelease=$prerelease latest=$latest (highest stable tag: ${highest:-none})"

      - name: Release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if scripts/changelog-notes.sh "$VERSION" CHANGELOG.md > release-notes.md; then
            echo "source=CHANGELOG.md" >> "$GITHUB_OUTPUT"
          else
            rm -f release-notes.md
            echo "::warning file=CHANGELOG.md::CHANGELOG.md has no '## [$VERSION]' section: the release notes are generated by git-cliff instead. Cut releases with scripts/release.sh to keep CHANGELOG.md in sync."
            echo "source=git-cliff (CHANGELOG.md has no section for $VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes fallback (git-cliff)
        if: steps.notes.outputs.source != 'CHANGELOG.md'
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.1
          config: cliff.toml
          # --current = the release the checked-out tag points to (--latest would be the newest tag of the
          # repository, wrong when re-building an older tag); --use-branch-tags ignores tags of other branches.
          args: --current --use-branch-tags --strip header
        env:
          OUTPUT: release-notes.md
          CLIFF_NO_HEADING: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          [ -s release-notes.md ] || printf 'Scope %s\n' "$VERSION" > release-notes.md
          echo "--- release notes ---"; cat release-notes.md; echo "---"
          if gh release view "$TAG" --json isDraft --jq .isDraft >/dev/null 2>&1; then
            # Re-run: refresh the notes, keep the current draft/published state; the dmg job re-uploads the assets.
            gh release edit "$TAG" --title "Scope $VERSION" --notes-file release-notes.md
          else
            args=(--draft --verify-tag --title "Scope $VERSION" --notes-file release-notes.md)
            if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
            gh release create "$TAG" "${args[@]}"
          fi

  dmg:
    name: Build, package, publish
    needs: release
    runs-on: macos-26 # Apple Silicon; the archive is universal (arm64 + x86_64) anyway
    timeout-minutes: 90
    env:
      # macos-26 ships Xcode 26.0.1 … 26.6 (26.6 = image default). Pinned; bump together with ci.yml.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      VERSION: ${{ needs.release.outputs.version }}
      PRERELEASE: ${{ needs.release.outputs.prerelease }}
      LATEST: ${{ needs.release.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # CURRENT_PROJECT_VERSION = git rev-list --count HEAD needs the full history

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen create-dmg
          xcodegen --version
          create-dmg --version
          # SwiftTerm ships a Metal shader and Xcode 26 does not bundle the Metal compiler (idempotent).
          xcodebuild -downloadComponent MetalToolchain

      - name: Cache SwiftPM clones (SourcePackages)
        uses: actions/cache@v6
        with:
          path: SourcePackages
          # Same key as ci.yml: a tag build reuses the cache saved on main.
          key: spm-xcode-${{ runner.os }}-${{ runner.arch }}-xcode26.6-${{ hashFiles('project.yml', '**/Package.swift', '**/Package.resolved') }}
          restore-keys: |
            spm-xcode-${{ runner.os }}-${{ runner.arch }}-xcode26.6-

      - name: Sparkle tools (generate_appcast, sign_update)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/Sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_TARBALL_SHA256  $RUNNER_TEMP/Sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle" ./bin
          "$RUNNER_TEMP/sparkle/bin/generate_appcast" --help >/dev/null
          echo "SPARKLE_BIN=$RUNNER_TEMP/sparkle/bin" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, package (scripts/package.sh)
        id: package
        env:
          # Code signing (all optional; without them the build is ad-hoc signed)
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Notarization, either flavour (optional)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: scripts/package.sh

      - name: Release notes for Sparkle (same text as the GitHub release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          gh release view "$TAG" --json body --jq .body > "build/Scope-$VERSION.md"

      - name: Sparkle appcast (scripts/appcast.sh)
        id: appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          REPO: ${{ github.repository }}
          NOTES_FILE: build/Scope-${{ env.VERSION }}.md
        run: scripts/appcast.sh "dist/Scope-$VERSION.dmg"

      - name: Upload the assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=("dist/Scope-$VERSION.dmg" "dist/Scope-$VERSION.dmg.sha256")
          if [ -f dist/appcast.xml ]; then assets+=(dist/appcast.xml); fi
          gh release upload "$TAG" "${assets[@]}" --clobber

      - name: Publish the release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --draft=false --prerelease
          elif [ "$LATEST" = true ]; then
            gh release edit "$TAG" --draft=false --latest
          else
            gh release edit "$TAG" --draft=false --latest=false # older version than the current latest release
          fi
          echo "url=$(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_OUTPUT"

      - name: Keep the build outputs (also on failure)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Scope-${{ env.VERSION }}
          path: |
            dist/
            build/appcast/
            build/*.log
            build/*.md
          if-no-files-found: ignore

      - name: Summary
        if: always()
        env:
          NOTES_SOURCE: ${{ needs.release.outputs.notes_source }}
          DMG_NAME: ${{ steps.package.outputs.dmg_name }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          BUILD_NUMBER: ${{ steps.package.outputs.build_number }}
          SIGNED: ${{ steps.package.outputs.signed }}
          IDENTITY: ${{ steps.package.outputs.identity }}
          NOTARIZED: ${{ steps.package.outputs.notarized }}
          SPARKLE_KEY: ${{ steps.package.outputs.sparkle_key }}
          SPARKLE_FRAMEWORK: ${{ steps.package.outputs.sparkle_framework }}
          APPCAST: ${{ steps.appcast.outputs.appcast }}
          APPCAST_REASON: ${{ steps.appcast.outputs.appcast_reason }}
          APPCAST_ITEMS: ${{ steps.appcast.outputs.appcast_items }}
          URL: ${{ steps.publish.outputs.url }}
        run: |
          case "$SIGNED" in
            true)  signing="Developer ID (\`$IDENTITY\`)" ;;
            false) signing="**ad-hoc** (no MACOS_CERTIFICATE_P12_BASE64 / APPLE_TEAM_ID): users must run \`xattr -d com.apple.quarantine /Applications/Scope.app\`" ;;
            *)     signing="build failed" ;;
          esac
          case "$NOTARIZED" in
            true)  notarization="notarized and stapled (.app and .dmg)" ;;
            false) if [ "$SIGNED" = true ]; then notarization="**skipped** (no APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD nor APP_STORE_CONNECT_* secrets)"; else notarization="skipped (requires a Developer ID signature)"; fi ;;
            *)     notarization="-" ;;
          esac
          case "$APPCAST" in
            generated) appcast="appcast.xml uploaded ($APPCAST_ITEMS items, Sparkle $SPARKLE_FRAMEWORK, public key $SPARKLE_KEY)" ;;
            skipped)   appcast="**skipped**: $APPCAST_REASON" ;;
            *)         appcast="not run" ;;
          esac
          if [ "$PRERELEASE" = true ]; then kind="prerelease"
          elif [ "$LATEST" = true ]; then kind="stable, marked Latest (SUFeedURL now resolves to this release)"
          else kind="stable, not marked Latest (a higher version already exists)"; fi
          {
            echo "## Scope $VERSION (\`$TAG\`)"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Release | ${URL:-not published (job failed)} |"
            echo "| Kind | $kind |"
            echo "| DMG | \`${DMG_NAME:-not built}\` (CFBundleVersion ${BUILD_NUMBER:-?}) |"
            echo "| SHA-256 | \`${SHA256:-?}\` |"
            echo "| Code signing | $signing |"
            echo "| Notarization | $notarization |"
            echo "| Sparkle feed | $appcast |"
            echo "| Release notes | ${NOTES_SOURCE:-?} |"
          } >> "$GITHUB_STEP_SUMMARY"
